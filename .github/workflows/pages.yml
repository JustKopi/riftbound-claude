# Napi árfrissítés + GitHub Pages telepítés.
# Egyszeri beállítás: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Update prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # naponta 05:17 UTC, a Cardmarket napi árlistája után
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh card data and Cardmarket prices
        run: python3 scripts/build_data.py collection.json

      - name: Commit updated data.js
        run: |
          if git diff --quiet -- data.js; then echo "No price changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: daily Cardmarket price update"
          git push

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html data.js _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
